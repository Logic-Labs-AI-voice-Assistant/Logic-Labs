<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice IT Helpdesk</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f9f0;
      margin: 0;
      padding: 2rem;
      color: #1a3a2e;
    }
    .app-card {
      max-width: 1080px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #c8e6c9;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(45, 90, 39, 0.08);
    }
    .hidden { display: none !important; }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 1.25rem 1.75rem;
      border-bottom: 1px solid #d4edc9;
      position: relative;
      background: #f8fdf8;
    }
    .app-title { font-size: 18px; font-weight: 700; color: #1a3a2e; letter-spacing: -0.3px; }
    .session-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #4a7c43;
      font-weight: 500;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3b6d11;
      box-shadow: 0 0 0 2px rgba(59, 109, 17, 0.2);
    }
    .profile-wrap { position: relative; }
    .avatar-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #a3d977;
      background: #e8f5e9;
      color: #2d5a27;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .avatar-btn:hover { background: #d4edc9; border-color: #7cb342; }
    .profile-menu {
      display: none;
      position: absolute;
      top: 48px;
      right: 0;
      background: #ffffff;
      border: 1px solid #c8e6c9;
      border-radius: 12px;
      min-width: 170px;
      box-shadow: 0 8px 24px rgba(45, 90, 39, 0.12);
      z-index: 10;
      overflow: hidden;
    }
    .profile-menu.open { display: block; }
    .profile-menu button {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 12px 16px;
      font-size: 13px;
      cursor: pointer;
      color: #2d5a27;
      transition: background 0.2s ease;
    }
    .profile-menu button:hover { background: #f0f9f0; }
    .profile-menu button.danger { color: #c62828; border-top: 1px solid #e8f5e9; }
    .profile-menu button.danger:hover { background: #ffebee; }

    /* Chat view */
    .chat-layout { display: grid; grid-template-columns: 2.4fr 1fr; }
    .chat-panel { padding: 2rem; border-right: 1px solid #e8f5e9; background: #fafdf9; }

    /* ---------- Voice button (bigger) ---------- */
    .listening-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 22px 44px;
      min-height: 76px;
      background: #e8f5e9;
      color: #2d5a27;
      border-radius: 999px;
      margin-bottom: 1.75rem;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2px;
      border: 2px solid #a3d977;
      box-shadow: 0 6px 18px rgba(45, 90, 39, 0.12);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .listening-pill:hover {
      background: #d4edc9;
      border-color: #7cb342;
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(45, 90, 39, 0.2);
    }
    .listening-pill:active { transform: translateY(0); }
    .listening-pill::before {
      content: "";
      width: 16px;
      height: 16px;
      flex: none;
      background: #3b6d11;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .message-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 320px;
      max-height: 560px;
      overflow-y: auto;
      padding-right: 10px;
    }
    .message {
      max-width: 78%;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14.5px;
      line-height: 1.55;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message .role { font-size: 11px; color: #6b9b63; margin: 0 0 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .message p { margin: 0; color: #2d5a27; }
    .message.user { align-self: flex-end; background: #e8f5e9; border: 1px solid #c8e6c9; }
    .message.agent { align-self: flex-start; background: #ffffff; border: 1px solid #d4edc9; box-shadow: 0 2px 8px rgba(45, 90, 39, 0.06); }

    .chat-input-area { display: flex; gap: 10px; margin-top: 1.75rem; }
    .chat-input-area input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #a3d977;
      border-radius: 12px;
      font-size: 14.5px;
      outline: none;
      background: #ffffff;
      color: #2d5a27;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .chat-input-area input:focus { border-color: #7cb342; box-shadow: 0 0 0 3px rgba(163, 217, 119, 0.25); }
    .chat-input-area button {
      padding: 14px 24px;
      border: 2px solid #2d5a27;
      border-radius: 12px;
      background: #2d5a27;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .chat-input-area button:hover { background: #3b6d11; border-color: #3b6d11; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(45, 90, 39, 0.1); }
    .chat-input-area button.secondary { background: #ffffff; color: #2d5a27; border-color: #a3d977; }
    .chat-input-area button.secondary:hover { background: #e8f5e9; border-color: #7cb342; }

    .sidebar { padding: 2rem 1.75rem; background: #f5fbf5; }
    .sidebar-label { font-size: 12px; color: #6b9b63; margin: 0 0 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .ticket-card {
      border: 1px solid #d4edc9;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      font-size: 13px;
      background: #ffffff;
      transition: all 0.2s ease;
    }
    .ticket-card:hover { border-color: #a3d977; box-shadow: 0 2px 8px rgba(45, 90, 39, 0.08); }
    .ticket-card .status { font-size: 12px; color: #6b9b63; margin-top: 4px; font-weight: 500; }

    /* Dashboard view */
    #dashboard-view { padding: 2rem; background: #fafdf9; }
    .dashboard-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 1.75rem; }
    .dashboard-toolbar button {
      flex: none;
      padding: 11px 18px;
      border: 2px solid #a3d977;
      border-radius: 12px;
      background: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #2d5a27;
      transition: all 0.2s ease;
    }
    .dashboard-toolbar button:hover { background: #e8f5e9; border-color: #7cb342; }
    .dashboard-title { font-size: 17px; font-weight: 700; color: #1a3a2e; }
    #create-btn { margin-left: auto; background: #2d5a27; color: #ffffff; border-color: #2d5a27; }
    #create-btn:hover { background: #3b6d11; border-color: #3b6d11; }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 1.75rem; }
    .stat-card { background: #e8f5e9; border-radius: 12px; padding: 18px; border: 1px solid #c8e6c9; transition: all 0.2s ease; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(45, 90, 39, 0.1); }
    .stat-label { font-size: 12px; color: #6b9b63; margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 26px; font-weight: 700; margin: 6px 0 0; color: #1a3a2e; }

    .ticket-table { border: 1px solid #d4edc9; border-radius: 12px; overflow: hidden; background: #ffffff; }
    .ticket-row {
      display: grid;
      grid-template-columns: 80px 1fr 120px 110px 44px;
      gap: 10px;
      padding: 15px 18px;
      font-size: 13.5px;
      align-items: center;
      border-top: 1px solid #e8f5e9;
      transition: background 0.2s ease;
    }
    .ticket-row:hover { background: #f8fdf8; }
    .ticket-row.header-row {
      background: #e8f5e9;
      color: #4a7c43;
      font-size: 12px;
      font-weight: 700;
      border-top: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-open { color: #c62828; font-weight: 600; }
    .status-in_progress { color: #e65100; font-weight: 600; }
    .status-resolved { color: #2e7d32; font-weight: 600; }
    .delete-btn {
      border: none;
      background: transparent;
      color: #c62828;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .delete-btn:hover { background: #ffebee; }

    /* ---------- Ticket modal ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 58, 46, 0.45);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: calc(100vh - 3rem);
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #c8e6c9;
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(45, 90, 39, 0.28);
      overflow: hidden;
      transform: translateY(16px) scale(0.97);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #e8f5e9;
      background: #f8fdf8;
    }
    .modal-icon {
      width: 38px;
      height: 38px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      font-size: 18px;
    }
    .modal-title { font-size: 16px; font-weight: 700; color: #1a3a2e; margin: 0; }
    .modal-subtitle { font-size: 12.5px; color: #6b9b63; margin: 2px 0 0; }
    .modal-close {
      margin-left: auto;
      width: 34px;
      height: 34px;
      flex: none;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #6b9b63;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .modal-close:hover { background: #e8f5e9; color: #2d5a27; }

    .modal-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      overflow-y: auto;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #4a7c43;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 7px;
    }
    .field label .req { color: #c62828; }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #d4edc9;
      border-radius: 11px;
      font-size: 14.5px;
      font-family: inherit;
      color: #2d5a27;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .field input::placeholder,
    .field textarea::placeholder { color: #9dbf95; }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #7cb342;
      box-shadow: 0 0 0 3px rgba(163, 217, 119, 0.28);
    }
    .field textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
    .field.invalid input,
    .field.invalid textarea { border-color: #e57373; box-shadow: 0 0 0 3px rgba(229, 115, 115, 0.15); }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .field-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; min-height: 16px; }
    .error-text { font-size: 12px; color: #c62828; font-weight: 600; }
    .counter { font-size: 11.5px; color: #9dbf95; margin-left: auto; font-weight: 600; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 1.1rem 1.5rem;
      border-top: 1px solid #e8f5e9;
      background: #fafdf9;
    }
    .btn {
      padding: 12px 22px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }
    .btn-ghost { background: #ffffff; color: #2d5a27; border-color: #c8e6c9; }
    .btn-ghost:hover { background: #f0f9f0; border-color: #a3d977; }
    .btn-primary { background: #2d5a27; color: #ffffff; border-color: #2d5a27; }
    .btn-primary:hover { background: #3b6d11; border-color: #3b6d11; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(45, 90, 39, 0.18); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 18px);
      background: #2d5a27;
      color: #ffffff;
      padding: 13px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(45, 90, 39, 0.3);
      opacity: 0;
      pointer-events: none;
      transition: all 0.28s ease;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 820px) {
      body { padding: 1rem; }
      .chat-layout { grid-template-columns: 1fr; }
      .chat-panel { border-right: none; border-bottom: 1px solid #e8f5e9; }
      .field-row { grid-template-columns: 1fr; }
      .listening-pill { width: 100%; padding: 20px 28px; font-size: 18px; }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f0f9f0; }
    ::-webkit-scrollbar-thumb { background: #a3d977; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #7cb342; }
  </style>
</head>
<body>

  <div class="app-card">
    <header class="app-header">
      <span class="app-title">Voice IT Helpdesk</span>
      <span class="session-status">
        <span class="status-dot"></span>
        Session active
      </span>

      <div class="profile-wrap">
        <button id="profile-btn" class="avatar-btn" aria-label="Profile menu">AR</button>
        <div id="profile-menu" class="profile-menu">
          <button id="settings-btn">Settings</button>
          <button id="logout-btn" class="danger">Log out</button>
        </div>
      </div>
    </header>

    <section id="chat-view">
      <div class="chat-layout">
        <div class="chat-panel">
          <div class="listening-pill" title="Click to speak">Voice</div>

          <div id="message-list" class="message-list"></div>

          <div class="chat-input-area">
            <input type="text" id="message-input" placeholder="Describe your IT issue or click the pill to speak..." autocomplete="off" />
            <button id="send-btn">Send</button>
            <button id="tickets-btn" class="secondary">My tickets</button>
          </div>
        </div>

        <div class="sidebar">
          <p class="sidebar-label">Open tickets</p>
          <div id="sidebar-tickets"></div>
        </div>
      </div>
    </section>

    <section id="dashboard-view" class="hidden">
      <div class="dashboard-toolbar">
        <button id="back-btn">← Back</button>
        <span class="dashboard-title">Tickets dashboard</span>
        <button id="create-btn">+ Create ticket</button>
      </div>

      <div class="stats-row">
        <div class="stat-card"><p class="stat-label">Open</p><p id="stat-open" class="stat-value">0</p></div>
        <div class="stat-card"><p class="stat-label">In progress</p><p id="stat-progress" class="stat-value">0</p></div>
        <div class="stat-card"><p class="stat-label">Resolved</p><p id="stat-resolved" class="stat-value">0</p></div>
      </div>

      <div class="ticket-table">
        <div class="ticket-row header-row">
          <span>ID</span><span>Issue</span><span>Status</span><span>Opened</span><span></span>
        </div>
        <div id="ticket-rows"></div>
      </div>
    </section>
  </div>

  <!-- ===== Create ticket modal ===== -->
  <div class="modal-overlay" id="ticket-modal" role="dialog" aria-modal="true" aria-labelledby="ticket-modal-title">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-icon">🎫</div>
        <div>
          <h2 class="modal-title" id="ticket-modal-title">Create a new ticket</h2>
          <p class="modal-subtitle">Tell us what's going on and we'll route it to the right team.</p>
        </div>
        <button class="modal-close" id="modal-close-btn" aria-label="Close dialog">✕</button>
      </div>

      <form id="ticket-form" novalidate>
        <div class="modal-body">
          <div class="field" id="field-issue">
            <label for="ticket-issue">Issue summary <span class="req">*</span></label>
            <input
              type="text"
              id="ticket-issue"
              name="issue"
              placeholder="e.g. Laptop won't connect to office Wi-Fi"
              maxlength="120"
              autocomplete="off"
            />
            <div class="field-meta">
              <span class="error-text" id="issue-error"></span>
              <span class="counter" id="issue-counter">0 / 120</span>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="ticket-category">Category</label>
              <select id="ticket-category" name="category">
                <option value="hardware">Hardware</option>
                <option value="software">Software</option>
                <option value="network">Network / VPN</option>
                <option value="account">Account &amp; Access</option>
                <option value="email">Email</option>
                <option value="other" selected>Other</option>
              </select>
            </div>

            <div class="field">
              <label for="ticket-priority">Priority</label>
              <select id="ticket-priority" name="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="ticket-description">Details</label>
            <textarea
              id="ticket-description"
              name="description"
              placeholder="What happened? When did it start? Any error messages? (Ctrl + Enter to submit)"
              maxlength="1000"
            ></textarea>
            <div class="field-meta">
              <span class="counter" id="desc-counter">0 / 1000</span>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-submit-btn">Create ticket</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = "/api";
    let sessionId = null;

    const profileBtn = document.getElementById("profile-btn");
    const profileMenu = document.getElementById("profile-menu");
    const logoutBtn = document.getElementById("logout-btn");
    const settingsBtn = document.getElementById("settings-btn");
    const chatView = document.getElementById("chat-view");
    const dashboardView = document.getElementById("dashboard-view");
    const ticketsBtn = document.getElementById("tickets-btn");
    const backBtn = document.getElementById("back-btn");
    const createBtn = document.getElementById("create-btn");
    const messageInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const messageList = document.getElementById("message-list");
    const sidebarTickets = document.getElementById("sidebar-tickets");
    const ticketRows = document.getElementById("ticket-rows");
    const statOpen = document.getElementById("stat-open");
    const statProgress = document.getElementById("stat-progress");
    const statResolved = document.getElementById("stat-resolved");
    const listeningPill = document.querySelector(".listening-pill");

    // ---- Ticket modal elements ----
    const modalOverlay = document.getElementById("ticket-modal");
    const ticketForm = document.getElementById("ticket-form");
    const issueInput = document.getElementById("ticket-issue");
    const issueField = document.getElementById("field-issue");
    const issueError = document.getElementById("issue-error");
    const issueCounter = document.getElementById("issue-counter");
    const descInput = document.getElementById("ticket-description");
    const descCounter = document.getElementById("desc-counter");
    const categorySelect = document.getElementById("ticket-category");
    const prioritySelect = document.getElementById("ticket-priority");
    const modalCloseBtn = document.getElementById("modal-close-btn");
    const modalCancelBtn = document.getElementById("modal-cancel-btn");
    const modalSubmitBtn = document.getElementById("modal-submit-btn");
    const toastEl = document.getElementById("toast");

    // ---- Auth-aware Fetch Wrapper ----
    async function fetchWithAuth(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        credentials: "include", // CRITICAL: Sends the session_id cookie to the backend
      });
      if (res.status === 401) {
        window.location.href = "/login";
        throw new Error("Unauthorized");
      }
      return res;
    }

    // ---- Toast ----
    let toastTimer = null;
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
    }

    // ---- Profile dropdown ----
    profileBtn.addEventListener("click", () => profileMenu.classList.toggle("open"));
    document.addEventListener("click", (e) => {
      if (!profileBtn.contains(e.target) && !profileMenu.contains(e.target)) {
        profileMenu.classList.remove("open");
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        await fetchWithAuth(`${API_BASE}/auth/logout`, { method: "POST" });
      } catch (err) {
        console.warn("Logout failed:", err);
      }
      window.location.href = "/login";
    });

    settingsBtn.addEventListener("click", () => alert("Settings screen not built yet."));

    // ---- View switching ----
    ticketsBtn.addEventListener("click", async () => {
      chatView.classList.add("hidden");
      dashboardView.classList.remove("hidden");
      await loadTickets();
    });

    backBtn.addEventListener("click", () => {
      dashboardView.classList.add("hidden");
      chatView.classList.remove("hidden");
    });

    // ---- Conversation & Voice ----
    async function ensureSession() {
      if (!sessionId) {
        const res = await fetchWithAuth(`${API_BASE}/session/start`, { method: "POST" });
        const data = await res.json();
        sessionId = data.session_id;
      }
      return sessionId;
    }

    sendBtn.addEventListener("click", async () => {
      const text = messageInput.value.trim();
      if (!text) return;

      messageInput.value = "";
      addMessage("user", text);

      try {
        await ensureSession();
        const msgRes = await fetchWithAuth(`${API_BASE}/message`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, text: text }),
        });
        const msgData = await msgRes.json();
        addMessage("agent", msgData.text);
      } catch (err) {
        console.error(err);
        addMessage("agent", "Could not reach backend. Make sure you are logged in.");
      }
    });

    messageInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendBtn.click();
    });

    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = `message ${role}`;
      el.innerHTML = `<p class="role">${role === "user" ? "You" : "Agent"}</p><p>${text}</p>`;
      messageList.appendChild(el);
      messageList.scrollTop = messageList.scrollHeight;
    }

    // Web Speech API Integration
    let recognition = null;
    if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";

      recognition.onresult = (event) => {
        messageInput.value = event.results[0][0].transcript;
        sendBtn.click();
      };

      recognition.onerror = () => { listeningPill.textContent = "Voice is listening"; };
      recognition.onend = () => { listeningPill.textContent = "Voice is listening"; };

      listeningPill.addEventListener("click", () => {
        try {
          recognition.start();
          listeningPill.textContent = "Listening...";
        } catch (e) {
          console.error("Recognition start failed", e);
        }
      });
    } else {
      listeningPill.textContent = "Voice not supported in this browser";
      listeningPill.style.opacity = "0.7";
      listeningPill.style.cursor = "default";
    }

    // ---- Ticket modal logic ----
    let lastFocusedEl = null;

    function openTicketModal() {
      lastFocusedEl = document.activeElement;
      modalOverlay.classList.add("open");
      resetTicketForm();
      // wait for the transition before focusing
      setTimeout(() => issueInput.focus(), 180);
      document.addEventListener("keydown", onModalKeydown);
    }

    function closeTicketModal() {
      modalOverlay.classList.remove("open");
      document.removeEventListener("keydown", onModalKeydown);
      if (lastFocusedEl && lastFocusedEl.focus) lastFocusedEl.focus();
    }

    function onModalKeydown(e) {
      if (e.key === "Escape") {
        e.preventDefault();
        closeTicketModal();
      }
    }

    function resetTicketForm() {
      ticketForm.reset();
      issueField.classList.remove("invalid");
      issueError.textContent = "";
      issueCounter.textContent = "0 / 120";
      descCounter.textContent = "0 / 1000";
      modalSubmitBtn.disabled = false;
      modalSubmitBtn.textContent = "Create ticket";
    }

    issueInput.addEventListener("input", () => {
      issueCounter.textContent = `${issueInput.value.length} / 120`;
      if (issueInput.value.trim()) {
        issueField.classList.remove("invalid");
        issueError.textContent = "";
      }
    });

    descInput.addEventListener("input", () => {
      descCounter.textContent = `${descInput.value.length} / 1000`;
    });

    // Ctrl/Cmd + Enter submits from the textarea
    descInput.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        ticketForm.requestSubmit();
      }
    });

    // Click on backdrop closes
    modalOverlay.addEventListener("mousedown", (e) => {
      if (e.target === modalOverlay) closeTicketModal();
    });

    modalCloseBtn.addEventListener("click", closeTicketModal);
    modalCancelBtn.addEventListener("click", closeTicketModal);

    createBtn.addEventListener("click", openTicketModal);

    ticketForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const issue = issueInput.value.trim();
      if (!issue) {
        issueField.classList.add("invalid");
        issueError.textContent = "Please describe the issue in a few words.";
        issueInput.focus();
        return;
      }

      const payload = {
        issue: issue,
        description: descInput.value.trim(),
        category: categorySelect.value,
        priority: prioritySelect.value,
      };

      modalSubmitBtn.disabled = true;
      modalSubmitBtn.textContent = "Creating…";

      try {
        await fetchWithAuth(`${API_BASE}/tickets`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        closeTicketModal();
        showToast("Ticket created successfully ✓");
        await loadTickets();
      } catch (err) {
        console.warn(err);
        modalSubmitBtn.disabled = false;
        modalSubmitBtn.textContent = "Create ticket";
        issueField.classList.add("invalid");
        issueError.textContent = "Could not create the ticket. Please try again.";
      }
    });

    // ---- Tickets ----
    async function loadTickets() {
      try {
        const res = await fetchWithAuth(`${API_BASE}/tickets`);
        const tickets = await res.json();
        renderSidebarTickets(tickets);
        renderDashboardTickets(tickets);
      } catch (err) {
        console.error("Failed to load tickets:", err);
        sidebarTickets.innerHTML = "<div class='ticket-card'>Backend not reachable or not logged in</div>";
      }
    }

    function renderSidebarTickets(tickets) {
      sidebarTickets.innerHTML = "";
      tickets.slice(0, 3).forEach((t) => {
        const el = document.createElement("div");
        el.className = "ticket-card";
        el.innerHTML = `<div><strong>#${t.id}</strong> · ${t.issue}</div><div class="status">${t.status.replace("_", " ")}</div>`;
        sidebarTickets.appendChild(el);
      });
    }

    function renderDashboardTickets(tickets) {
      ticketRows.innerHTML = "";
      let open = 0, inProgress = 0, resolved = 0;

      tickets.forEach((t) => {
        if (t.status === "open") open++;
        if (t.status === "in_progress") inProgress++;
        if (t.status === "resolved") resolved++;

        const row = document.createElement("div");
        row.className = "ticket-row";
        row.innerHTML = `
          <span><strong>#${t.id}</strong></span>
          <span>${t.issue}</span>
          <span class="status-${t.status}">${t.status.replace("_", " ")}</span>
          <span>${new Date(t.opened).toLocaleDateString()}</span>
          <button class="delete-btn" data-id="${t.id}" aria-label="Delete ticket ${t.id}">✕</button>
        `;
        ticketRows.appendChild(row);
      });

      statOpen.textContent = open;
      statProgress.textContent = inProgress;
      statResolved.textContent = resolved;

      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Are you sure you want to delete this ticket?")) return;
          try {
            await fetchWithAuth(`${API_BASE}/tickets/${btn.dataset.id}`, { method: "DELETE" });
            showToast("Ticket deleted");
          } catch (e) {
            console.warn(e);
          }
          await loadTickets();
        });
      });
    }

    // Initial load
    loadTickets();
  </script>
</body>
</html>
